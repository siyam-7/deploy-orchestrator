services:
  postgres:
    image: postgres:17
    container_name: deploy-orchestrator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deploy_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deploy_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: